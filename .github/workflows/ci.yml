# CI：测试 + 兼容性门禁（第六轮 C12 新建——此前零 CI，靠部署机手工触发）。
# 覆盖：ubuntu（debian 系）与 windows 双端 × Node 24（LTS）/ 26（部署机版本）。
# engines >=24 与 CI 矩阵一致：部署机 = Windows + Node 26，LTS = 24。
# 测试全离线（mock 完善，无真实网络调用）；check:compat 无 --probe（不依赖服务器）。
# v1.0.0（C1）：依赖全为官方 npm 版 + patch-package 本地补丁（26.1.2 适配），
# 无 git 依赖 → 不再需要 git+ssh→https rewrite hack。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: windows-latest
            node: 24
          - os: windows-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (node --test, 全离线)
        run: npm test

      - name: Lint (eslint flat config)
        run: npm run lint

      - name: Type check (tsc checkJs, src 全部 @ts-check)
        run: npm run typecheck

      # 覆盖率基线报告（仅 ubuntu/24 跑一次；本阶段不设阈值门禁——mock 为主）
      - name: Coverage report (informational)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Compatibility gate (check:compat, 离线模式)
        run: npm run check:compat

      # 信息性审计（不门禁）：git 依赖 audit 支持不可靠（可能直接报错退出），且
      # axios 0.21.4 是已文档化接受风险（Xbox 认证链，offline 模式不执行该路径，
      # 见 docs/architecture.md）——continue-on-error 只捕获新增高危漏洞
      - name: Dependency audit (informational)
        run: npm audit --omit=dev --audit-level=high || true
        continue-on-error: true

  # 第 11 轮：部署安装模式镜像——deploy.ps1 用 npm ci --omit=dev，CI 主 job 用
  # npm ci 全量，两种安装模式不同构（minecraft-protocol 版本检查依赖 devDependency
  # 被传递依赖 hoist 顶层的巧合）——此 job 复现部署路径，防 check:compat 行为分叉
  deploy-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (deploy mode, omit dev)
        run: npm ci --omit=dev

      - name: Compatibility gate (deploy mode)
        run: npm run check:compat
